name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # link rot shouldn't block a PR on an unrelated dead link, so it runs separately
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
      - run: pixi run check

  links:
    if:
      github.event_name == 'schedule' || github.event_name ==
      'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
      - run: pixi run links
